server:
  port: 8082

spring:
  application:
    name: boxue-course-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848   # Nacos 注册中心地址(Docker 起的容器)
    # OpenFeign 超时：默认 readTimeout 是 60 秒，下游卡住时会把线程和 DB 连接一起占死，
    # 这里收紧到 3s/5s，让失败足够快（超时不是让请求失败，而是让失败别拖垮整个服务）
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 5000
    # 关掉 LoadBalancer 的自动重试：spring-retry 在 classpath 上时，Feign 读超时后会自动再试一次，
    # 5s 变成 10s，而且下游已经卡住，重试只会加重它的负担（retry storm）
    loadbalancer:
      retry:
        enabled: false
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/boxue?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: boxue
    password: boxue123
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 3s
  ai:
    openai:
      # 移除了末尾的 /v1，Spring AI 会自动拼接 /v1/chat/completions
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: ${DASHSCOPE_API_KEY}
      chat:
        options:
          # qwen-turbo：百炼平台成本最低的极速响应模型
          model: qwen-turbo
      embedding:
        options:
          model: text-embedding-v3      # 通义千问向量模型：把文字转成语义坐标（RAG 检索用）

boxue:
  jwt:
    # 三个服务必须用同一个密钥，才能验证同一批登录 token（网关统一鉴权的基础）
    secret: boxue-learning-jwt-secret-key-32bytes!!
    expire-hours: 2

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

logging:
  level:
    com.boxue: info
springdoc:
  api-docs:
    # 标准路径：Knife4j 网关聚合时用「服务名」做 contextPath，
    # 若这里带业务前缀（/api/courses），contextPath 会和接口 path 重叠，文档 URL 重复
    path: /v3/api-docs
  swagger-ui:
    enabled: false