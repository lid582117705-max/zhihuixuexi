server:
  port: 8082

spring:
  application:
    name: boxue-course-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848   # Nacos 注册中心地址(Docker 起的容器)
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/boxue?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: boxue
    password: boxue123
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 3s
  ai:
    openai:
      # 移除了末尾的 /v1，Spring AI 会自动拼接 /v1/chat/completions
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: ${DASHSCOPE_API_KEY}
      chat:
        options:
          # qwen-turbo：百炼平台成本最低的极速响应模型
          model: qwen-turbo
      embedding:
        options:
          model: text-embedding-v3      # 通义千问向量模型：把文字转成语义坐标（RAG 检索用）

boxue:
  jwt:
    # 三个服务必须用同一个密钥，才能验证同一批登录 token（网关统一鉴权的基础）
    secret: boxue-learning-jwt-secret-key-32bytes!!
    expire-hours: 2

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

logging:
  level:
    com.boxue: info