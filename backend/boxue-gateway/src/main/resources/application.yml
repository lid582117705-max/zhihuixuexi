server:
  port: 8080

spring:
  application:
    name: boxue-gateway
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: user-service
          uri: lb://boxue-user-service
          predicates:
            - Path=/api/users/**,/api/health
        - id: course-service
          uri: lb://boxue-course-service
          predicates:
            - Path=/api/courses/**,/api/learn/**
        - id: order-service
          uri: lb://boxue-order-service
          predicates:
            - Path=/api/orders/**,/api/seckill/**,/api/dead-letters/**
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0

boxue:
  jwt:
    # 和三个服务同一个密钥，才能验证它们签发的 token
    secret: boxue-learning-jwt-secret-key-32bytes!!
    expire-hours: 2

logging:
  level:
    com.boxue: info
knife4j:
  gateway:
    enabled: true
    # 用 config（手动路由）模式：显式指定每个服务的文档地址，
    # 前缀用「服务名」，与业务前缀（/api/xxx）不重叠，避免 /api/users/api/users/login 这种重复。
    # 网关已开 discovery.locator，/boxue-xxx-service/** 路由会自动剥掉服务名前缀转发给对应服务。
    strategy: manual
    routes:
      - name: 用户服务
        service-name: boxue-user-service
        url: /boxue-user-service/v3/api-docs
        order: 1
      - name: 课程服务
        service-name: boxue-course-service
        url: /boxue-course-service/v3/api-docs
        order: 2
      - name: 订单服务
        service-name: boxue-order-service
        url: /boxue-order-service/v3/api-docs
        order: 3