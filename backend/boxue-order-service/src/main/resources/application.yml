server:
  port: 8083

spring:
  application:
    name: boxue-order-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848   # Nacos 注册中心地址(Docker 起的容器)
    # OpenFeign 超时：默认 readTimeout 是 60 秒，下游卡住时会把线程和 DB 连接一起占死，
    # 10 个并发就能拖垮订单服务（Hikari 默认只有 10 个连接）。这里收紧到 3s/5s，让失败足够快。
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 5000
    # 关掉 LoadBalancer 的自动重试：spring-retry 在 classpath 上时，Feign 读超时后会自动再试一次，
    # 5s 变成 10s，而且下游已经卡住，重试只会加重它的负担（retry storm）
    loadbalancer:
      retry:
        enabled: false
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/boxue?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: boxue
    password: boxue123
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 3s
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
    publisher-confirm-type: correlated   # 生产者确认
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual         # 消费者手动确认

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

boxue:
  jwt:
    secret: boxue-learning-jwt-secret-key-32bytes!!
    expire-hours: 2
  admin:
    # 管理员 userId 白名单（逗号分隔），只有这些用户能访问 /api/dead-letters/**
    user-ids: 4
  snowflake:
    # 雪花 ID 机器号（0~1023）。订单号目前用 Redis 自增，这里保留是因为 SnowflakeIdGenerator 仍注册为 bean；
    # 若重新启用雪花，多实例部署时每台必须不同
    worker-id: 1

logging:
  level:
    com.boxue: info
springdoc:
  api-docs:
    # 标准路径：Knife4j 网关聚合时用「服务名」做 contextPath，
    # 若这里带业务前缀（/api/orders），contextPath 会和接口 path 重叠，文档 URL 重复
    path: /v3/api-docs
  swagger-ui:
    enabled: false