server:
  port: 8081

spring:
  application:
    name: boxue-backend
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/boxue?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: boxue
    password: boxue123
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 3s
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
    # ===== 加餐C：MQ 可靠性 =====
    publisher-confirm-type: correlated   # 生产者确认：发送带 correlationId，broker 落盘后回调 ack/nack
    publisher-returns: true              # 路由失败回调开关
    template:
      mandatory: true                    # 路由不到队列时直接把消息退回给生产者（配合 returns 回调）
    listener:
      simple:
        acknowledge-mode: manual         # 消费者手动确认：业务成功才 ack，失败显式 nack 进死信
        # 注：重试由消费者代码自己实现（见 OrderCloseConsumer），不用 Spring listener.retry。
        # 踩坑记录：manual 模式下 Spring retry 耗尽后的隐式拒收不可靠，消息会卡在 unacked 不进死信

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

boxue:
  jwt:
    # 学习环境密钥，正式项目应放到环境变量
    secret: boxue-learning-jwt-secret-key-32bytes!!
    expire-hours: 2

logging:
  level:
    com.boxue: info