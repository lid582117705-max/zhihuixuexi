# Prometheus 全局配置
global:
  scrape_interval: 15s      # 每 15 秒抓一次
  evaluation_interval: 15s  # 告警规则评估周期（本阶段不配告警）

scrape_configs:
  # 抓取本平台四个服务（容器内用服务名 DNS）
  - job_name: 'boxue-services'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - 'gateway:8080'
          - 'user-service:8081'
          - 'course-service:8082'
          - 'order-service:8083'