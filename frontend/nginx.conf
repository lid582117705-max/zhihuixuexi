# ======================================================
# 前端容器内的 Nginx 配置（只写 server 块，被主配置 include 进去）
#
# 这个文件干两件事：
#   1. 托管 Vue 打包出来的静态文件（HTML/JS/CSS）
#   2. 把 /api/... 的请求反向代理到网关容器 gateway:8080
#
# 【面试重点】为什么这里写 gateway 而不是 localhost:8080？
#   Nginx 跑在自己的容器里，对它来说 localhost = 这个 Nginx 容器自己，
#   根本没有后端。Docker Compose 会自动创建一个内部网络，并把每个服务名
#   注册成 DNS 记录，所以容器之间只能用「服务名」互相访问。
#   这和你 NOTES 里记的「容器内连中间件用服务名，不是 127.0.0.1」是同一个知识点。
# ======================================================

server {
    listen       80;
    server_name  localhost;

    # 静态资源根目录 = 镜像里 dist 拷过去的位置
    root   /usr/share/nginx/html;
    index  index.html;

    # 压缩：文本类资源开启 gzip，减少传输体积（JS/CSS 能压到 ~1/3）
    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---------- 核心1：前端路由 fallback ----------
    # 你的前端用的是 createWebHistory()（HTML5 History 模式），URL 长这样：
    #   http://localhost/courses  →  在浏览器里刷新
    # 浏览器会真的向 Nginx 请求 /courses 这个路径，但服务器上根本没有叫 courses 的文件 → 404
    # try_files 的含义：依次尝试下面这些，最后一项兜底
    #   1. $uri            → 有没有 /courses 这个真实文件？没有
    #   2. $uri/           → 有没有 /courses/ 这个目录？没有
    #   3. /index.html     → 兜底交给 index.html（它内部加载 JS，Vue Router 自己解析出 /courses 该显示哪个页面）
    # 如果换成 createWebHashHistory()（URL 带 #），请求永远是 /，就不需要这行
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 核心2：API 反向代理 ----------
    # 前端 axios 的 baseURL 是 '/'，请求路径形如 /api/users/login
    # 匹配到这条规则后转发给网关容器
    location /api/ {
        # 注意结尾没有 / ：/api/users/login 会原样转发成 http://gateway:8080/api/users/login
        # 如果写成 proxy_pass http://gateway:8080/;（带斜杠），Nginx 会把 location 前缀 /api/ 剥掉，
        # 变成 http://gateway:8080/users/login → 网关是 /api/** 路由规则，直接 404
        # 这是 Nginx 反代最经典的坑，面试常问
        proxy_pass http://gateway:8080;

        # 把真实客户端信息透传给后端（网关记日志、限流按 IP 统计都要用）
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ---------- AI 接口超时调整 ----------
        # 默认 proxy_read_timeout 是 60s，而 AI 助手（大模型）走 RAG + 工具调用，
        # 慢的时候可能超过 60s，会被 Nginx 掐断报 504。
        # 这里放宽到 180s，和前端 axios 的 30s 超时配合（前端先断，用户体验上可控）
        proxy_read_timeout    180s;
        proxy_send_timeout    180s;
        proxy_connect_timeout 30s;
    }

    # 前端静态资源的强缓存：Vite 打包的文件名带内容 hash（如 index-a1b2c3.js），
    # 内容一变文件名就变，所以可以让浏览器放心长期缓存，减少重复请求
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
